version: '3.8'

services:
  db:
    image: postgres:15
    container_name: votacao-db
    profiles:
      - backend
      - fullstack
    environment:
      POSTGRES_DB: votacao_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d votacao_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: votacao-app
    profiles:
      - backend
      - fullstack
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: votacao_db
      DB_USER: admin
      DB_PASS: admin

  frontend:
    build: ./frontend
    container_name: votacao-frontend
    profiles:
      - frontend
      - fullstack
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules

  adminer:
    image: adminer
    container_name: votacao-adminer
    profiles:
      - backend
      - fullstack
    ports:
      - "8081:8080"
    depends_on:
      - db
